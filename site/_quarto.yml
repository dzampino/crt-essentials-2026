project:
  type: website
  output-dir: ../docs
  resources:
    - files/**
    - js/**

website:
  title: "CRT Essentials"
  description: "Passwords, PKI, email security, PowerShell and a Windows DFIR box: calculators, sample files, commands and references."
  site-url: https://dzampino.github.io/crt-essentials-2026/
  repo-url: https://github.com/dzampino/crt-essentials-2026
  repo-actions: [source, issue]
  page-navigation: true
  search: true
  navbar:
    background: "#0C2454"
    left:
      - href: index.qmd
        text: Home
      - href: passwords.qmd
        text: Passwords
      - href: pki.qmd
        text: PKI
      - href: email.qmd
        text: Email security
      - href: powershell.qmd
        text: PowerShell
      - href: dfir.qmd
        text: DFIR box
      - href: references.qmd
        text: References
  page-footer:
    left: "CRT Annual Training Conference 2026"
    right: "Wisconsin Cyber Response Team"

format:
  html:
    # Light and dark themes add a toggle to the navbar; the default follows the reader's system setting
    theme:
      light: cosmo
      dark: [cosmo, dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style:
      light: github
      dark: github-dark
    syntax-definitions:
      - ../syntax/smtp.xml
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true

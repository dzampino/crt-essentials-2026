<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
	<title>Certificate chain: a root CA in the client's trust store signs an intermediate CA, which signs the leaf certificate for squeakycurds.example</title>
	<rect width="1600" height="900" fill="#ffffff"/>
	<defs>
		<marker id="Arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6472"/></marker>
	</defs>
	<g font-size="34">
		<rect x="120" y="60" width="760" height="190" rx="14" fill="#0C2454"/>
		<text x="160" y="125" fill="#ffffff" font-weight="600" font-size="40">Root CA</text>
		<text x="160" y="175" fill="#D6DEEA">Subject = Issuer (self-signed)</text>
		<text x="160" y="220" fill="#D6DEEA">Basic Constraints: CA:TRUE</text>

		<rect x="120" y="355" width="760" height="190" rx="14" fill="#ffffff" stroke="#0C2454" stroke-width="4"/>
		<text x="160" y="420" fill="#0C2454" font-weight="600" font-size="40">Intermediate CA</text>
		<text x="160" y="470" fill="#1A1D23">Issuer = Root CA</text>
		<text x="160" y="515" fill="#1A1D23">Basic Constraints: CA:TRUE</text>

		<rect x="120" y="650" width="760" height="190" rx="14" fill="#ffffff" stroke="#D9383A" stroke-width="4"/>
		<text x="160" y="715" fill="#D9383A" font-weight="600" font-size="40">Leaf (end entity)</text>
		<text x="160" y="765" fill="#1A1D23">SAN: DNS:squeakycurds.example</text>
		<text x="160" y="810" fill="#1A1D23">EKU: TLS server authentication</text>

		<line x1="500" y1="250" x2="500" y2="350" stroke="#5A6472" stroke-width="4" marker-end="url(#Arrow)"/>
		<text x="525" y="312" fill="#5A6472">signs</text>
		<line x1="500" y1="545" x2="500" y2="645" stroke="#5A6472" stroke-width="4" marker-end="url(#Arrow)"/>
		<text x="525" y="607" fill="#5A6472">signs</text>

		<rect x="980" y="60" width="500" height="190" rx="14" fill="#EEF1F5"/>
		<text x="1010" y="125" fill="#0C2454" font-weight="600">Client supplies</text>
		<text x="1010" y="175" fill="#1A1D23">Trust anchor from its</text>
		<text x="1010" y="220" fill="#1A1D23">certificate store</text>

		<rect x="980" y="355" width="500" height="485" rx="14" fill="#EEF1F5"/>
		<text x="1010" y="420" fill="#0C2454" font-weight="600">Server presents</text>
		<text x="1010" y="470" fill="#1A1D23">Leaf certificate</text>
		<text x="1010" y="515" fill="#1A1D23">+ intermediate(s)</text>
		<text x="1010" y="610" fill="#1A1D23">Proves possession of</text>
		<text x="1010" y="655" fill="#1A1D23">the leaf's private key</text>
		<text x="1010" y="750" fill="#5A6472" font-size="28">The private key never</text>
		<text x="1010" y="790" fill="#5A6472" font-size="28">leaves the server</text>
	</g>
</svg>
